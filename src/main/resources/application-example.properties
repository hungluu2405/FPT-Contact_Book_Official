# ===================================================================
# Example Application Configuration
# Copy this file to application.properties or set environment variables
# ===================================================================
spring.application.name=fpt-contact-book
server.port=8080

# Datasource Credentials (Set via ENV in production)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FptContactBook;encrypt=true;trustServerCertificate=true
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Jackson
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Thymeleaf
spring.thymeleaf.cache=false

# Session
server.servlet.session.timeout=30m

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=./uploads

# Messages
spring.messages.basename=messages
spring.messages.encoding=UTF-8
