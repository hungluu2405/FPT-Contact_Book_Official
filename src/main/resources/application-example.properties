# ===================================================================
# Example Application Configuration
# Copy this file to application.properties or set environment variables
# ===================================================================
spring.application.name=fpt-contact-book
server.port=8080

# Datasource Credentials (Set via ENV in production)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FptContactBook;encrypt=true;trustServerCertificate=true
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# Jackson
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Thymeleaf
spring.thymeleaf.cache=false

# Session
server.servlet.session.timeout=30m

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
app.upload-dir=./uploads

# -------------------------------------------------------------------
# Attendance
# Absence warning when absent sessions exceed this percent of non-cancelled sessions
# -------------------------------------------------------------------
app.attendance.absent-threshold-percent=20
# Giáo viên điểm danh, sửa điểm danh trong số giờ này (tính từ lần điểm danh đầu; buổi chưa điểm danh tính từ
# giờ kết thúc buổi). Quá hạn chỉ ADMIN sửa được.
app.attendance.edit-window-hours=24

# -------------------------------------------------------------------
# REST API cho mobile (JWT)
# JWT_SECRET: khoa ky HS256, toi thieu 32 byte. De trong thi ung dung tu sinh khoa ngau nhien
# moi lan khoi dong (chi dung cho may dev); moi truong that BAT BUOC dat bien nay.
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=14d

# -------------------------------------------------------------------
# Email (quen mat khau). Mac dinh gui qua Mailpit tren may nay (SMTP localhost:1025, xem thu tai
# http://localhost:8025). Du lieu mau co email that dang @fpt.edu.vn nen SMTP khac localhost bi chan,
# tru khi dat MAIL_ALLOW_EXTERNAL_HOST=true (moi truong that, kem MAIL_USERNAME, MAIL_PASSWORD, MAIL_STARTTLS).
# -------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@contactbook.local}
app.mail.allow-external-host=${MAIL_ALLOW_EXTERNAL_HOST:false}

# -------------------------------------------------------------------
# OpenAPI (springdoc): chi mo ta /api/**; xem tai /swagger-ui.html
# -------------------------------------------------------------------
springdoc.paths-to-match=/api/**
springdoc.packages-to-scan=vn.edu.fpt.contactbook.controller.api

# Messages
spring.messages.basename=messages
spring.messages.encoding=UTF-8
