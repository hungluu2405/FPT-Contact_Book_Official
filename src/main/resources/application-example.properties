# ===================================================================
# Example Application Configuration
# Copy this file to application.properties or set environment variables
# ===================================================================
spring.application.name=fpt-contact-book
server.port=8080

# Datasource Credentials (Set via ENV in production)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FptContactBook;encrypt=true;trustServerCertificate=true
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# Jackson
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Thymeleaf
spring.thymeleaf.cache=false

# Session
server.servlet.session.timeout=30m

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
app.upload-dir=./uploads

# -------------------------------------------------------------------
# Attendance
# Absence warning when absent sessions exceed this percent of non-cancelled sessions
# -------------------------------------------------------------------
app.attendance.absent-threshold-percent=20
# Giáo viên điểm danh, sửa điểm danh trong số giờ này (tính từ lần điểm danh đầu; buổi chưa điểm danh tính từ
# giờ kết thúc buổi). Quá hạn chỉ ADMIN sửa được.
app.attendance.edit-window-hours=24

# -------------------------------------------------------------------
# REST API cho mobile (JWT)
# JWT_SECRET: khoa ky HS256, toi thieu 32 byte. De trong thi ung dung tu sinh khoa ngau nhien
# moi lan khoi dong (chi dung cho may dev); moi truong that BAT BUOC dat bien nay.
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=14d

# -------------------------------------------------------------------
# OpenAPI (springdoc): chi mo ta /api/**; xem tai /swagger-ui.html
# -------------------------------------------------------------------
springdoc.paths-to-match=/api/**
springdoc.packages-to-scan=vn.edu.fpt.contactbook.controller.api

# Messages
spring.messages.basename=messages
spring.messages.encoding=UTF-8
