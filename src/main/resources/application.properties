# ===================================================================
# Application Configuration
# System: FPT University Electronic Contact Book (Web)
# ===================================================================
spring.application.name=fpt-contact-book
server.port=8080

# -------------------------------------------------------------------
# Datasource Configuration (SQL Server)
# Overridable via DB_URL, DB_USERNAME, DB_PASSWORD environment variables
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=FptContactBook;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# Strict schema validation, open-in-view disabled
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# -------------------------------------------------------------------
# Jackson Serialization
# -------------------------------------------------------------------
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# -------------------------------------------------------------------
# Thymeleaf Template Engine
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# -------------------------------------------------------------------
# Session Management
# -------------------------------------------------------------------
server.servlet.session.timeout=30m

# -------------------------------------------------------------------
# File Upload (Multipart)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
app.upload-dir=./uploads

# -------------------------------------------------------------------
# Attendance
# Absence warning when absent sessions exceed this percent of non-cancelled sessions
# -------------------------------------------------------------------
app.attendance.absent-threshold-percent=20

# -------------------------------------------------------------------
# REST API cho mobile (JWT)
# JWT_SECRET: khoa ky HS256, toi thieu 32 byte. De trong thi ung dung tu sinh khoa ngau nhien
# moi lan khoi dong (chi dung cho may dev); moi truong that BAT BUOC dat bien nay.
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=14d

# -------------------------------------------------------------------
# OpenAPI (springdoc): chi mo ta /api/**; xem tai /swagger-ui.html
# -------------------------------------------------------------------
springdoc.paths-to-match=/api/**
springdoc.packages-to-scan=vn.edu.fpt.contactbook.controller.api

# -------------------------------------------------------------------
# Internationalization / Localization
# -------------------------------------------------------------------
spring.messages.basename=messages
spring.messages.encoding=UTF-8
