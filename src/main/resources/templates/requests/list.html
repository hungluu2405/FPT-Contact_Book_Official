<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${pageTitle} + ' - ' + #{app.title}">Đơn từ</title>
</head>
<body>
<section>
    <!--/* Đơn của học sinh (baseUrl /student/requests) hoặc của con (/parent/children/{id}/requests). */-->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="page-title mb-0" th:text="${pageTitle}">Đơn từ</h1>
        <div class="d-flex flex-wrap gap-2" th:unless="${noChildren}">
            <a class="btn btn-orange btn-lg" th:href="@{${baseUrl} + '/new'}">
                <i class="bi bi-calendar-x"></i> <span th:text="#{request.new-leave}">Gửi đơn xin nghỉ</span></a>
            <a th:if="${canSendOther}" class="btn btn-outline-primary btn-lg" th:href="@{${baseUrl} + '/new-other'}">
                <i class="bi bi-file-earmark-plus"></i> <span th:text="#{request.new-other}">Gửi đơn khác</span></a>
        </div>
    </div>
    <p th:if="${noChildren}" class="alert alert-info" th:text="#{schedule.no-children}">Chưa liên kết con.</p>
    <th:block th:unless="${noChildren}">
        <div class="card card-custom p-3 mb-3" th:if="${children != null}">
            <div class="col-md-4">
                <label for="childSelect" class="form-label" th:text="#{schedule.child}">Con</label>
                <select id="childSelect" class="form-select" data-child-select th:attr="data-url-template=${childUrlTemplate}">
                    <option th:each="c : ${children}" th:value="${c.id}" th:selected="${c.id == studentId}"
                            th:text="${c.code} + ' - ' + ${c.name}">SE190001</option>
                </select>
            </div>
        </div>
        <div class="card card-custom p-4">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th th:text="#{request.created-at}">Ngày gửi</th>
                        <th th:text="#{request.type}">Loại đơn</th>
                        <th th:text="#{request.title}">Tiêu đề</th>
                        <th th:text="#{request.dates}">Thời gian nghỉ</th>
                        <th th:text="#{request.requester}">Người gửi</th>
                        <th th:text="#{request.status}">Trạng thái</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${items.content}">
                        <td th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}">01/10/2026 08:00</td>
                        <td th:text="#{'request-type.' + ${r.type}}">Xin nghỉ</td>
                        <td>
                            <div th:text="${r.title}">Tiêu đề</div>
                            <div class="small text-muted" th:if="${r.sectionCode}" th:text="${r.sectionCode}">PRJ301</div>
                        </td>
                        <td><span th:replace="~{fragments/requests :: dates(${r.fromDate}, ${r.toDate})}"></span></td>
                        <td th:text="${r.requesterName}">Người gửi</td>
                        <td><span th:replace="~{fragments/requests :: status(${r.status})}"></span></td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{${baseUrl} + '/' + ${r.id}}"
                               th:text="#{request.view}">Xem</a>
                        </td>
                    </tr>
                    <tr th:if="${items.empty}">
                        <td colspan="7" class="text-center text-muted py-4" th:text="#{request.empty}">Chưa có đơn nào</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <nav th:replace="~{fragments/pager :: pager(${pager})}"></nav>
    </th:block>
    <script th:src="@{/js/child-select.js}"></script>
</section>
</body>
</html>
