<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${pageTitle} + ' - ' + #{app.title}">Duyệt đơn</title>
</head>
<body>
<section>
    <!--/* Đơn người đăng nhập phải duyệt (baseUrl /teacher/requests hoặc /admin/requests), lọc theo trạng thái. */-->
    <h1 class="page-title" th:text="${pageTitle}">Duyệt đơn</h1>
    <ul class="nav nav-pills mb-3 flex-wrap">
        <li class="nav-item" th:each="s : ${statuses}">
            <a class="nav-link" th:classappend="${status == s.name()} ? 'active'"
               th:href="@{${baseUrl}(status=${s})}" th:text="#{'request-status.' + ${s}}">Chờ duyệt</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${status == 'ALL'} ? 'active'"
               th:href="@{${baseUrl}(status='ALL')}" th:text="#{request.filter.all}">Tất cả</a>
        </li>
    </ul>
    <div class="card card-custom p-4">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th th:text="#{request.created-at}">Ngày gửi</th>
                    <th th:text="#{request.student}">Sinh viên</th>
                    <th th:text="#{request.type}">Loại đơn</th>
                    <th th:text="#{request.title}">Tiêu đề</th>
                    <th th:text="#{request.dates}">Thời gian nghỉ</th>
                    <th th:text="#{request.status}">Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${items.content}">
                    <td th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}">01/10/2026 08:00</td>
                    <td>
                        <div th:text="${r.studentName}">Nguyễn Văn A</div>
                        <div class="small text-muted" th:text="${r.studentCode}">SE190001</div>
                    </td>
                    <td th:text="#{'request-type.' + ${r.type}}">Xin nghỉ</td>
                    <td>
                        <div th:text="${r.title}">Tiêu đề</div>
                        <div class="small text-muted" th:if="${r.sectionCode}" th:text="${r.sectionCode}">PRJ301</div>
                    </td>
                    <td><span th:replace="~{fragments/requests :: dates(${r.fromDate}, ${r.toDate})}"></span></td>
                    <td><span th:replace="~{fragments/requests :: status(${r.status})}"></span></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{${baseUrl} + '/' + ${r.id}}"
                           th:text="#{request.view}">Xem</a>
                    </td>
                </tr>
                <tr th:if="${items.empty}">
                    <td colspan="7" class="text-center text-muted py-4" th:text="#{request.empty}">Chưa có đơn nào</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <nav th:replace="~{fragments/pager :: pager(${pager})}"></nav>
</section>
</body>
</html>
