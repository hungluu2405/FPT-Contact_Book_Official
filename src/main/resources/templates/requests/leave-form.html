<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="#{request.new-leave} + ' - ' + #{app.title}">Gửi đơn xin nghỉ</title>
</head>
<body>
<section>
    <!--/* Đơn nghỉ của sinh viên hoặc phụ huynh gửi thay; mọi giá trị được kiểm tra lại ở RequestService. */-->
    <a th:replace="~{fragments/catalog :: back(${baseUrl}, #{request.back})}"></a>
    <h1 class="page-title" th:text="#{request.new-leave}">Gửi đơn xin nghỉ</h1>
    <p class="text-muted" th:text="#{request.for-student(${options.studentName}, ${options.studentCode})}">Sinh viên</p>
    <form th:action="@{${baseUrl} + '/new'}" th:object="${form}" method="post" enctype="multipart/form-data" novalidate>
        <div th:replace="~{fragments/catalog :: globalErrors}"></div>
        <div class="card card-custom p-4">
            <div class="row g-3">
                <div th:replace="~{fragments/catalog :: date('fromDate', #{request.from}, true, 'col-md-4')}"></div>
                <div th:replace="~{fragments/catalog :: date('toDate', #{request.to}, true, 'col-md-4')}"></div>
                <div class="col-md-4">
                    <label for="sectionId" class="form-label" th:text="#{request.section}">Lớp học phần</label>
                    <select class="form-select" th:field="*{sectionId}"
                            th:classappend="${#fields.hasErrors('sectionId')} ? 'is-invalid'">
                        <option value="" th:text="#{request.section.all}">Tất cả các lớp</option>
                        <option th:each="o : ${options.sections}" th:value="${o.id}" th:text="${o.code} + ' - ' + ${o.name}">PRJ301</option>
                    </select>
                    <div class="form-text" th:text="#{request.section.hint}">Để trống nếu nghỉ mọi lớp.</div>
                    <div class="invalid-feedback" th:errors="*{sectionId}">Lỗi</div>
                </div>
                <div class="col-12">
                    <label for="title" class="form-label" th:text="#{request.title}">Tiêu đề</label>
                    <input type="text" class="form-control" th:field="*{title}" maxlength="200" data-leave-title
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                    <div class="form-text" th:text="#{request.title.hint}">Để trống sẽ tự điền.</div>
                    <div class="invalid-feedback" th:errors="*{title}">Lỗi</div>
                </div>
                <div class="col-12">
                    <label for="reason" class="form-label" th:text="#{request.reason} + ' *'">Lý do</label>
                    <textarea class="form-control" rows="5" th:field="*{reason}" maxlength="1000"
                              th:classappend="${#fields.hasErrors('reason')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:errors="*{reason}">Lỗi</div>
                </div>
                <div class="col-12">
                    <label for="files" class="form-label" th:text="#{request.files}">Tệp minh chứng</label>
                    <input type="file" id="files" name="files" class="form-control" multiple
                           accept=".pdf,.jpg,.jpeg,.png,.docx,.xlsx">
                    <div class="form-text" th:text="#{notification.files.hint}">Tối đa 5 tệp.</div>
                </div>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-3">
            <button type="submit" class="btn btn-orange btn-lg"><i class="bi bi-send"></i>
                <span th:text="#{request.send}">Gửi đơn</span></button>
            <a class="btn btn-outline-secondary btn-lg" th:href="@{${baseUrl}}" th:text="#{common.cancel}">Hủy</a>
        </div>
    </form>
    <script th:src="@{/js/leave-form.js}"></script>
</section>
</body>
</html>
