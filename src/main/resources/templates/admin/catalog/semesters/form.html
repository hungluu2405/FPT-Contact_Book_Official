<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="(${id} ? #{semester.edit} : #{semester.new}) + ' - ' + #{app.title}">Danh mục</title>
</head>
<body>
<section>
    <a th:replace="~{fragments/catalog :: back('/admin/catalog/semesters', #{semester.list})}"></a>
    <h1 class="page-title" th:text="${id} ? #{semester.edit} : #{semester.new}">Thêm</h1>

    <form th:action="${id} ? @{/admin/catalog/semesters/{id}/edit(id=${id})} : @{/admin/catalog/semesters/new}" th:object="${form}"
          method="post" novalidate>
        <div th:replace="~{fragments/catalog :: globalErrors}"></div>
        <div class="card card-custom p-4">
            <div class="row g-3">
                <div th:replace="~{fragments/catalog :: code('col-md-4')}"></div>
                <div th:replace="~{fragments/catalog :: text('name', #{catalog.name}, 100, true, 'col-md-8')}"></div>
                <div th:replace="~{fragments/catalog :: date('startDate', #{semester.start-date}, true, 'col-md-6')}"></div>
                <div th:replace="~{fragments/catalog :: date('endDate', #{semester.end-date}, true, 'col-md-6')}"></div>
            </div>
        </div>
        <div th:replace="~{fragments/catalog :: buttons(${id} ? '/admin/catalog/semesters/' + ${id} : '/admin/catalog/semesters')}"></div>
    </form>
</section>
</body>
</html>
