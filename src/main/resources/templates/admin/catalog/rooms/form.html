<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="(${id} ? #{room.edit} : #{room.new}) + ' - ' + #{app.title}">Danh mục</title>
</head>
<body>
<section>
    <a th:replace="~{fragments/catalog :: back('/admin/catalog/rooms', #{room.list})}"></a>
    <h1 class="page-title" th:text="${id} ? #{room.edit} : #{room.new}">Thêm</h1>

    <form th:action="${id} ? @{/admin/catalog/rooms/{id}/edit(id=${id})} : @{/admin/catalog/rooms/new}" th:object="${form}"
          method="post" novalidate>
        <div th:replace="~{fragments/catalog :: globalErrors}"></div>
        <div class="card card-custom p-4">
            <div class="row g-3">
                <div th:replace="~{fragments/catalog :: code('col-md-4')}"></div>
                <div th:replace="~{fragments/catalog :: text('name', #{catalog.name}, 100, true, 'col-md-8')}"></div>
                <div th:replace="~{fragments/catalog :: text('building', #{room.building}, 100, false, 'col-md-8')}"></div>
                <div th:replace="~{fragments/catalog :: number('capacity', #{room.capacity}, '1', '32767', '1', false, 'col-md-4')}"></div>
            </div>
        </div>
        <div th:replace="~{fragments/catalog :: buttons(${id} ? '/admin/catalog/rooms/' + ${id} : '/admin/catalog/rooms')}"></div>
    </form>
</section>
</body>
</html>
