<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="#{session.weekly} + ' - ' + #{app.title}">Lịch</title>
</head>
<body>
<section>
    <a th:replace="~{fragments/catalog :: back('/admin/sections/' + ${item.id}, ${item.code})}"></a>
    <h1 class="page-title" th:text="#{session.weekly} + ': ' + ${item.code}">Tạo lịch hàng tuần</h1>
    <p class="text-muted" th:text="#{session.weekly.hint}">Các buổi được kiểm tra xung đột trước khi lưu.</p>
    <div th:replace="~{fragments/schedule :: conflicts(${conflicts})}"></div>

    <form th:action="@{/admin/sections/{id}/sessions/weekly(id=${item.id})}" th:object="${form}" method="post" novalidate>
        <div th:replace="~{fragments/catalog :: globalErrors}"></div>
        <div class="card card-custom p-4">
            <div class="row g-3">
                <div class="col-12">
                    <span class="form-label d-block" th:text="#{session.weekly.days} + ' *'">Các thứ</span>
                    <div class="d-flex flex-wrap gap-3">
                        <div class="form-check" th:each="d : ${weekdays}">
                            <input class="form-check-input" type="checkbox" th:field="*{days}" th:value="${d}">
                            <label class="form-check-label" th:for="${#ids.prev('days')}" th:text="#{'weekday.' + ${d}}">Thứ Hai</label>
                        </div>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('days')}" th:errors="*{days}">Lỗi</div>
                </div>
                <div class="col-md-4">
                    <label for="startTime" class="form-label" th:text="#{schedule.start-time} + ' *'">Giờ</label>
                    <input type="text" placeholder="hh:mm" maxlength="5" autocomplete="off"
                           class="form-control" th:field="*{startTime}"
                           th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{startTime}">Lỗi</div>
                </div>
                <div class="col-md-4">
                    <label for="endTime" class="form-label" th:text="#{schedule.end-time} + ' *'">Giờ</label>
                    <input type="text" placeholder="hh:mm" maxlength="5" autocomplete="off"
                           class="form-control" th:field="*{endTime}"
                           th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{endTime}">Lỗi</div>
                </div>
                <div class="col-md-4">
                    <label for="roomId" class="form-label" th:text="#{schedule.room}">Phòng</label>
                    <select class="form-select" th:field="*{roomId}"
                            th:classappend="${#fields.hasErrors('roomId')} ? 'is-invalid'">
                        <option value="" th:text="#{schedule.no-room}">Chưa xếp phòng</option>
                        <option th:each="o : ${rooms}" th:value="${o.id}" th:text="${o.code} + ' - ' + ${o.name}">R101</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{roomId}">Lỗi</div>
                </div>
                <div th:replace="~{fragments/catalog :: date('fromDate', #{session.weekly.from}, true, 'col-md-4')}"></div>
                <div th:replace="~{fragments/catalog :: number('count', #{session.weekly.count}, '1', '200', '1', true, 'col-md-4')}"></div>
            </div>
        </div>
        <div th:replace="~{fragments/catalog :: buttons('/admin/sections/' + ${item.id})}"></div>
    </form>
</section>
</body>
</html>
