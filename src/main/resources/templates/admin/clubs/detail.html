<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${item.name} + ' - ' + #{app.title}">Câu lạc bộ</title>
</head>
<body>
<section>
    <a th:replace="~{fragments/catalog :: back('/admin/clubs', #{club.admin.list})}"></a>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div class="d-flex align-items-center gap-3">
            <span th:replace="~{fragments/clubs :: logo(${item.logoUrl}, 64)}"></span>
            <div>
                <h1 class="page-title mb-0" th:text="${item.name}">Tên CLB</h1>
                <span class="text-muted" th:text="${item.code}">F-CODE</span>
                <span th:replace="~{fragments/clubs :: clubStatus(${item.status})}"></span>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/clubs/{id}(id=${item.id})}" th:text="#{club.view-public}">Xem trang CLB</a>
            <a class="btn btn-orange" th:href="@{/admin/clubs/{id}/edit(id=${item.id})}">
                <i class="bi bi-pencil"></i> <span th:text="#{common.edit}">Sửa</span></a>
            <form th:if="${item.status.name() == 'ACTIVE'}" method="post" th:action="@{/admin/clubs/{id}/deactivate(id=${item.id})}"
                  th:attr="data-confirm=#{club.deactivate.confirm}">
                <button type="submit" class="btn btn-outline-danger" th:text="#{club.deactivate}">Ngừng hoạt động</button>
            </form>
            <form th:unless="${item.status.name() == 'ACTIVE'}" method="post" th:action="@{/admin/clubs/{id}/activate(id=${item.id})}"
                  th:attr="data-confirm=#{club.activate.confirm}">
                <button type="submit" class="btn btn-outline-success" th:text="#{club.activate}">Mở lại</button>
            </form>
        </div>
    </div>

    <div class="card card-custom p-4 mb-3">
        <dl class="row mb-0">
            <dt class="col-sm-3" th:text="#{club.president}">Chủ nhiệm</dt>
            <dd class="col-sm-9" th:text="${item.presidentName} ?: #{club.president.none}">Tên</dd>
            <dt class="col-sm-3" th:text="#{club.advisor}">Phụ trách</dt>
            <dd class="col-sm-9" th:text="${item.advisorName} ?: #{club.advisor.none}">GV</dd>
            <dt class="col-sm-3" th:text="#{club.founded}">Ngày thành lập</dt>
            <dd class="col-sm-9" th:text="${item.foundedDate} ? ${#temporals.format(item.foundedDate, 'dd/MM/yyyy')} : '—'">01/01/2020</dd>
            <dt class="col-sm-3" th:text="#{club.members}">Thành viên</dt>
            <dd class="col-sm-9" th:text="#{club.members.count(${item.memberCount})}">3 thành viên</dd>
            <dt class="col-sm-3" th:text="#{club.description}">Mô tả</dt>
            <dd class="col-sm-9 text-pre-line" th:text="${item.description} ?: '—'">Mô tả</dd>
        </dl>
    </div>

    <div class="card card-custom p-4">
        <h2 class="h5" th:text="#{club.president.assign}">Chỉ định chủ nhiệm</h2>
        <p class="text-muted" th:text="#{club.president.hint}">Nhập mã học sinh.</p>
        <form method="post" th:action="@{/admin/clubs/{id}/president(id=${item.id})}" class="row g-2 align-items-end"
              th:attr="data-confirm=#{club.president.confirm}">
            <div class="col-md-6">
                <label for="studentCode" class="form-label" th:text="#{club.president.student-code}">Mã học sinh</label>
                <input type="text" class="form-control text-uppercase" id="studentCode" name="studentCode" maxlength="20" required>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary" th:text="#{common.save}">Lưu</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
