<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="(${id} ? #{club.edit} : #{club.new}) + ' - ' + #{app.title}">Câu lạc bộ</title>
</head>
<body>
<section>
    <a th:replace="~{fragments/catalog :: back('/admin/clubs', #{club.admin.list})}"></a>
    <h1 class="page-title" th:text="${id} ? #{club.edit} : #{club.new}">Thêm câu lạc bộ</h1>

    <form th:action="${id} ? @{/admin/clubs/{id}/edit(id=${id})} : @{/admin/clubs/new}" th:object="${form}"
          method="post" enctype="multipart/form-data" novalidate>
        <div th:replace="~{fragments/catalog :: globalErrors}"></div>
        <div class="card card-custom p-4">
            <div class="row g-3">
                <div th:replace="~{fragments/catalog :: code('col-md-4')}"></div>
                <div th:replace="~{fragments/catalog :: text('name', #{club.name}, 150, true, 'col-md-8')}"></div>
                <div th:replace="~{fragments/catalog :: textareaField('description', #{club.description}, 2000, 'col-12')}"></div>
                <div th:replace="~{fragments/catalog :: date('foundedDate', #{club.founded}, false, 'col-md-4')}"></div>
                <div class="col-md-8">
                    <label for="advisorUserId" class="form-label" th:text="#{club.advisor}">Giáo viên phụ trách</label>
                    <select class="form-select" th:field="*{advisorUserId}"
                            th:classappend="${#fields.hasErrors('advisorUserId')} ? 'is-invalid'">
                        <option value="" th:text="#{club.advisor.none}">Chưa có</option>
                        <option th:each="a : ${advisors}" th:value="${a.id}" th:text="${a.name} + ' (' + ${a.code} + ')'">GV</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{advisorUserId}">Lỗi</div>
                </div>
                <div class="col-12">
                    <label for="logo" class="form-label" th:text="#{club.logo}">Logo</label>
                    <input type="file" class="form-control" id="logo" name="logo" accept="image/png,image/jpeg"
                           th:classappend="${logoError} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${logoError}" th:text="${logoError}">Lỗi</div>
                    <div class="form-text" th:text="#{club.logo.hint}">JPG hoặc PNG, tối đa 2 MB.</div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/catalog :: buttons(${id} ? '/admin/clubs/' + ${id} : '/admin/clubs')}"></div>
    </form>
</section>
</body>
</html>
