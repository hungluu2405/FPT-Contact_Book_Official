<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  Các ô hồ sơ theo vai trò, dùng trong form thêm/sửa và form gán vai trò (cần th:object có thuộc tính profile).
  byRole = true: ẩn/hiện theo vai trò đang chọn (user-form.js); false: luôn hiện các khối show* = true.
*/-->
<div th:fragment="fields(showStudent, showTeacher, showParent, byRole)">
    <div class="card card-custom p-4 mb-3" th:if="${showStudent}" th:attr="data-role-section=${byRole} ? 'STUDENT' : null">
        <h2 class="h5 mb-3" th:text="#{user.section.student}">Hồ sơ học sinh</h2>
        <div class="row g-3">
            <div class="col-md-4">
                <label for="profile.studentCode" class="form-label" th:text="#{user.student-code} + ' *'">Mã HS</label>
                <input type="text" class="form-control" th:field="*{profile.studentCode}" maxlength="20"
                       th:classappend="${#fields.hasErrors('profile.studentCode')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{profile.studentCode}">Lỗi</div>
            </div>
            <div class="col-md-4">
                <label for="profile.majorId" class="form-label" th:text="#{user.major} + ' *'">Khối</label>
                <select class="form-select" th:field="*{profile.majorId}" data-major-select
                        th:classappend="${#fields.hasErrors('profile.majorId')} ? 'is-invalid'">
                    <option value="" th:text="#{user.choose}">Chọn</option>
                    <option th:each="m : ${majors}" th:value="${m.id}" th:text="${m.code} + ' - ' + ${m.name}">SE</option>
                </select>
                <div class="invalid-feedback" th:errors="*{profile.majorId}">Lỗi</div>
            </div>
            <div class="col-md-4">
                <label for="profile.classId" class="form-label" th:text="#{user.class}">Lớp</label>
                <select class="form-select" th:field="*{profile.classId}"
                        th:classappend="${#fields.hasErrors('profile.classId')} ? 'is-invalid'">
                    <option value="" th:text="#{user.no-class}">Chưa xếp lớp</option>
                    <option th:each="c : ${classes}" th:value="${c.id}" th:attr="data-major=${c.groupId}"
                            th:text="${c.code}">SE1901</option>
                </select>
                <div class="invalid-feedback" th:errors="*{profile.classId}">Lỗi</div>
            </div>
            <div class="col-md-4">
                <label for="profile.enrollmentYear" class="form-label" th:text="#{user.enrollment-year} + ' *'">Năm nhập học</label>
                <input type="number" class="form-control" th:field="*{profile.enrollmentYear}" min="1990" max="2100"
                       th:classappend="${#fields.hasErrors('profile.enrollmentYear')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{profile.enrollmentYear}">Lỗi</div>
            </div>
            <div class="col-md-4">
                <label for="profile.studentStatus" class="form-label" th:text="#{user.student-status}">Trạng thái học</label>
                <select class="form-select" th:field="*{profile.studentStatus}">
                    <option th:each="s : ${studentStatuses}" th:value="${s}" th:text="#{'student-status.' + ${s}}">Đang học</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card card-custom p-4 mb-3" th:if="${showTeacher}"
         th:attr="data-role-section=${byRole} ? 'TEACHER HEAD_OF_DEPARTMENT' : null">
        <h2 class="h5 mb-3" th:text="#{user.section.teacher}">Hồ sơ giáo viên</h2>
        <div class="row g-3">
            <div class="col-md-4">
                <label for="profile.teacherCode" class="form-label" th:text="#{user.teacher-code} + ' *'">Mã GV</label>
                <input type="text" class="form-control" th:field="*{profile.teacherCode}" maxlength="20"
                       th:classappend="${#fields.hasErrors('profile.teacherCode')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{profile.teacherCode}">Lỗi</div>
            </div>
            <div class="col-md-4">
                <label for="profile.teacherDepartmentId" class="form-label" th:text="#{user.department} + ' *'">Tổ chuyên môn</label>
                <select class="form-select" th:field="*{profile.teacherDepartmentId}"
                        th:classappend="${#fields.hasErrors('profile.teacherDepartmentId')} ? 'is-invalid'">
                    <option value="" th:text="#{user.choose}">Chọn</option>
                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.code} + ' - ' + ${d.name}">SE</option>
                </select>
                <div class="invalid-feedback" th:errors="*{profile.teacherDepartmentId}">Lỗi</div>
            </div>
            <div class="col-md-4">
                <label for="profile.academicTitle" class="form-label" th:text="#{user.academic-title}">Học hàm học vị</label>
                <input type="text" class="form-control" th:field="*{profile.academicTitle}" maxlength="50"
                       th:classappend="${#fields.hasErrors('profile.academicTitle')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{profile.academicTitle}">Lỗi</div>
            </div>
        </div>
    </div>

    <div class="card card-custom p-4 mb-3" th:if="${showParent}" th:attr="data-role-section=${byRole} ? 'PARENT' : null">
        <h2 class="h5 mb-3" th:text="#{user.section.parent}">Hồ sơ phụ huynh</h2>
        <label for="profile.occupation" class="form-label" th:text="#{user.occupation}">Nghề nghiệp</label>
        <input type="text" class="form-control" th:field="*{profile.occupation}" maxlength="100"
               th:classappend="${#fields.hasErrors('profile.occupation')} ? 'is-invalid'">
        <div class="invalid-feedback" th:errors="*{profile.occupation}">Lỗi</div>
    </div>
</div>
</body>
</html>
