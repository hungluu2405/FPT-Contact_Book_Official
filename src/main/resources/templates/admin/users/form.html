<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="(${user} ? #{user.edit} : #{user.new}) + ' - ' + #{app.title}">Người dùng</title>
</head>
<body>
<!--/* user = null: thêm mới (chọn vai trò); user != null: sửa (hồ sơ đang có). */-->
<section>
    <h1 class="page-title" th:text="${user} ? #{user.edit} + ': ' + ${user.fullName} : #{user.new}">Thêm người dùng</h1>

    <form th:action="${user} ? @{/admin/users/{id}/edit(id=${user.id})} : @{/admin/users/new}"
          th:object="${form}" method="post" novalidate id="userForm">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
            <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Lỗi</p>
        </div>

        <div class="card card-custom p-4 mb-3">
            <h2 class="h5 mb-3" th:text="#{user.section.personal}">Thông tin cá nhân</h2>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="phone" class="form-label" th:text="#{profile.phone} + ' *'">Số điện thoại</label>
                    <input type="tel" class="form-control" th:field="*{phone}" inputmode="tel" placeholder="0901234567"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{phone}">Lỗi</div>
                </div>
                <div class="col-md-6">
                    <label for="fullName" class="form-label" th:text="#{profile.full-name} + ' *'">Họ tên</label>
                    <input type="text" class="form-control" th:field="*{fullName}" maxlength="150"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{fullName}">Lỗi</div>
                </div>
                <div class="col-md-4">
                    <label for="gender" class="form-label" th:text="#{profile.gender}">Giới tính</label>
                    <select class="form-select" th:field="*{gender}">
                        <option value="" th:text="#{profile.empty}">Chưa cập nhật</option>
                        <option th:each="g : ${genders}" th:value="${g}" th:text="#{'gender.' + ${g}}">Nam</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="dateOfBirth" class="form-label" th:text="#{profile.date-of-birth}">Ngày sinh</label>
                    <input type="date" class="form-control" th:field="*{dateOfBirth}"
                           th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{dateOfBirth}">Lỗi</div>
                </div>
                <div class="col-md-4">
                    <label for="email" class="form-label" th:text="#{profile.email}">Email</label>
                    <input type="email" class="form-control" th:field="*{email}" maxlength="150"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}">Lỗi</div>
                </div>
                <div class="col-12">
                    <label for="address" class="form-label" th:text="#{profile.address}">Địa chỉ</label>
                    <input type="text" class="form-control" th:field="*{address}" maxlength="255"
                           th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{address}">Lỗi</div>
                </div>
            </div>
        </div>

        <div class="card card-custom p-4 mb-3" th:unless="${user}">
            <h2 class="h5 mb-3" th:text="#{home.roles} + ' *'">Vai trò</h2>
            <div class="d-flex flex-wrap gap-3" th:classappend="${#fields.hasErrors('roles')} ? 'is-invalid'">
                <div class="form-check" th:each="code : ${roleCodes}">
                    <input class="form-check-input" type="checkbox" th:field="*{roles}" th:value="${code}"
                           data-role-toggle>
                    <label class="form-check-label" th:for="${#ids.prev('roles')}" th:text="#{'role.' + ${code}}">Vai trò</label>
                </div>
            </div>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('roles')}" th:errors="*{roles}">Lỗi</div>
            <div class="mt-3" data-role-section="HEAD_OF_DEPARTMENT">
                <label for="headDepartmentId" class="form-label" th:text="#{user.head-department} + ' *'">Bộ môn</label>
                <select class="form-select" th:field="*{headDepartmentId}"
                        th:classappend="${#fields.hasErrors('headDepartmentId')} ? 'is-invalid'">
                    <option value="" th:text="#{user.choose}">Chọn</option>
                    <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.code} + ' - ' + ${d.name}">SE</option>
                </select>
                <div class="invalid-feedback" th:errors="*{headDepartmentId}">Lỗi</div>
            </div>
        </div>

        <div th:replace="~{admin/users/profile-fields :: fields(
                showStudent=${user == null or user.student != null},
                showTeacher=${user == null or user.teacher != null},
                showParent=${user == null or user.parent != null},
                byRole=${user == null})}"></div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-orange btn-lg" th:text="#{common.save}">Lưu</button>
            <a class="btn btn-outline-secondary btn-lg"
               th:href="${user} ? @{/admin/users/{id}(id=${user.id})} : @{/admin/users}" th:text="#{common.cancel}">Hủy</a>
        </div>
    </form>
    <script th:src="@{/js/user-form.js}"></script>
</section>
</body>
</html>
