<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="(${activityId} ? #{activity.edit} : #{activity.new}) + ' - ' + #{app.title}">Hoạt động</title>
</head>
<body>
<section th:with="club=${detail.club}">
    <a th:replace="~{fragments/catalog :: back('/clubs/' + ${club.id} + '/activities', #{club.manage.activities})}"></a>
    <h1 class="page-title" th:text="(${activityId} ? #{activity.edit} : #{activity.new}) + ' - ' + ${club.name}">Tạo hoạt động</h1>
    <form th:action="${activityId} ? @{/clubs/{c}/activities/{a}/edit(c=${club.id}, a=${activityId})} : @{/clubs/{c}/activities/new(c=${club.id})}"
          th:object="${form}" method="post" novalidate>
        <div th:replace="~{fragments/catalog :: globalErrors}"></div>
        <div class="card card-custom p-4">
            <div class="row g-3">
                <div th:replace="~{fragments/catalog :: text('title', #{activity.title}, 200, true, 'col-12')}"></div>
                <div th:replace="~{fragments/catalog :: textareaField('description', #{activity.description}, 2000, 'col-12')}"></div>
                <div th:replace="~{fragments/catalog :: text('location', #{activity.location}, 200, false, 'col-md-6')}"></div>
                <div class="col-md-6">
                    <label for="maxParticipants" class="form-label" th:text="#{activity.max}">Số lượng tối đa</label>
                    <input type="number" class="form-control" th:field="*{maxParticipants}" min="1" max="32767" step="1"
                           th:classappend="${#fields.hasErrors('maxParticipants')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{maxParticipants}">Lỗi</div>
                    <div class="form-text" th:text="#{activity.max.hint}">Để trống nếu không giới hạn.</div>
                </div>
                <div class="col-md-6">
                    <label for="startTime" class="form-label" th:text="#{activity.start} + ' *'">Bắt đầu</label>
                    <input type="datetime-local" class="form-control" th:field="*{startTime}"
                           th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{startTime}">Lỗi</div>
                </div>
                <div class="col-md-6">
                    <label for="endTime" class="form-label" th:text="#{activity.end} + ' *'">Kết thúc</label>
                    <input type="datetime-local" class="form-control" th:field="*{endTime}"
                           th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{endTime}">Lỗi</div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/catalog :: buttons('/clubs/' + ${club.id} + '/activities')}"></div>
    </form>
</section>
</body>
</html>
