<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="#{grade.sheet} + ': ' + ${sheet.section.code} + ' - ' + #{app.title}">Bảng điểm</title>
</head>
<body>
<section>
    <!--/* Giáo viên nhập điểm: ô chưa công bố là ô nhập (trống = chưa có điểm), ô đã công bố bị khóa. */-->
    <a th:replace="~{fragments/catalog :: back('/teacher/sections', #{menu.teacher.sections})}"></a>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
        <h1 class="page-title mb-0" th:text="#{grade.sheet} + ': ' + ${sheet.section.code}">Bảng điểm</h1>
        <a th:if="${sheet.weightsComplete}" class="btn btn-outline-primary"
           th:href="@{/teacher/sections/{id}/grades/import(id=${sheet.section.id})}">
            <i class="bi bi-file-earmark-spreadsheet"></i> <span th:text="#{grade.import}">Nhập từ Excel</span></a>
    </div>
    <p class="text-muted" th:text="${sheet.section.subjectCode} + ' - ' + ${sheet.section.subjectName} + ' · ' + ${sheet.section.semesterCode}">PRJ301</p>
    <div th:replace="~{fragments/grades :: weightWarning(${sheet})}"></div>
    <p th:if="${sheet.weightsComplete}" class="text-muted" th:text="#{grade.entry.hint}">Nhập điểm rồi bấm Lưu.</p>

    <form th:action="@{/teacher/sections/{id}/grades(id=${sheet.section.id})}" method="post" th:object="${form}" novalidate>
        <div class="card card-custom p-4">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th th:text="#{attendance.student-code}">Mã HS</th>
                        <th th:text="#{attendance.student}">Học sinh</th>
                        <th:block th:replace="~{fragments/grades :: componentHeaders(${sheet.components})}"></th:block>
                        <th class="text-center" th:text="#{grade.average}">Trung bình</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${sheet.rows}">
                        <td th:text="${row.studentCode}">SE190001</td>
                        <td th:text="${row.fullName}">Nguyễn Văn A</td>
                        <td class="text-center" th:each="cell, cellStat : ${row.cells}" style="min-width: 7rem">
                            <th:block th:if="${cell.published}">
                                <span th:replace="~{fragments/grades :: score(${cell.score})}"></span>
                                <i class="bi bi-lock-fill text-muted" th:title="#{grade.published}"></i>
                            </th:block>
                            <th:block th:unless="${cell.published}">
                                <input type="text" inputmode="decimal" class="form-control text-center"
                                       th:name="'scores[' + ${cell.key()} + ']'"
                                       th:value="${form.scores[cell.key()]}"
                                       th:disabled="${!sheet.weightsComplete}"
                                       th:classappend="${cellErrors.containsKey(cell.key())} ? 'is-invalid'"
                                       th:attr="aria-label=${row.studentCode} + ' - ' + ${sheet.components[cellStat.index].name}">
                                <div class="invalid-feedback" th:if="${cellErrors.containsKey(cell.key())}"
                                     th:text="${cellErrors[cell.key()]}">Lỗi</div>
                            </th:block>
                        </td>
                        <td class="text-center"><th:block th:replace="~{fragments/grades :: average(${row.average})}"></th:block></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(sheet.rows)}">
                        <td th:colspan="${#lists.size(sheet.components) + 3}" class="text-center text-muted py-4"
                            th:text="#{attendance.no-students}">Chưa có học sinh</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p th:replace="~{fragments/grades :: formula}"></p>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-3">
            <button th:if="${sheet.weightsComplete and !#lists.isEmpty(sheet.rows)}" type="submit" class="btn btn-orange btn-lg">
                <i class="bi bi-save"></i> <span th:text="#{grade.save}">Lưu điểm</span></button>
            <a class="btn btn-outline-secondary btn-lg" th:href="@{/teacher/sections}" th:text="#{common.back}">Quay lại</a>
        </div>
    </form>
</section>
</body>
</html>
