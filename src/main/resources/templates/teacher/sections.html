<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="#{menu.teacher.sections} + ' - ' + #{app.title}">Lớp giảng dạy</title>
</head>
<body>
<section>
    <h1 class="page-title" th:text="#{menu.teacher.sections}">Lớp giảng dạy</h1>
    <form class="card card-custom p-3 mb-3" th:action="@{/teacher/sections}" method="get">
        <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <label for="semesterId" class="form-label" th:text="#{section.semester}">Học kỳ</label>
                <select id="semesterId" name="semesterId" class="form-select">
                    <option th:each="s : ${semesters}" th:value="${s.id}" th:selected="${s.id == semester.id()}"
                            th:text="${s.code} + ' - ' + ${s.name}">FA26</option>
                </select>
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-primary" th:text="#{schedule.show}">Xem</button>
            </div>
        </div>
    </form>

    <div class="card card-custom p-4">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th th:text="#{attendance.section}">Lớp học phần</th>
                    <th th:text="#{section.subject}">Môn học</th>
                    <th th:text="#{section.status}">Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${items.content}">
                    <td th:text="${s.code}">PRJ301-SE1901-FA26</td>
                    <td th:text="${s.subjectCode} + ' - ' + ${s.subjectName}">PRJ301</td>
                    <td><span class="badge text-bg-secondary" th:text="#{'section-status.' + ${s.status}}">Đang mở</span></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-primary" th:href="@{/teacher/sections/{id}(id=${s.id})}">
                            <i class="bi bi-person-check"></i> <span th:text="#{attendance.title}">Điểm danh</span></a>
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/teacher/sections/{id}/grades(id=${s.id})}">
                            <i class="bi bi-journal-check"></i> <span th:text="#{grade.entry}">Nhập điểm</span></a>
                    </td>
                </tr>
                <tr th:if="${items.empty}">
                    <td colspan="4" class="text-center text-muted py-4" th:text="#{attendance.no-sections}">Không có lớp</td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{fragments/pager :: pager(${pager})}"></nav>
    </div>
</section>
</body>
</html>
