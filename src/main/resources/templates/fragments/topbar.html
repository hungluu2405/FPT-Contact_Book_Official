<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="topbar" class="app-topbar">
    <button class="btn btn-link app-menu-toggle d-md-none" type="button" data-bs-toggle="collapse"
            data-bs-target="#appSidebar" aria-controls="appSidebar" aria-expanded="false"
            th:attr="aria-label=#{menu.toggle}">
        <i class="bi bi-list"></i>
    </button>
    <a class="app-brand" th:href="@{/}">
        <img class="brand-logo" th:src="@{/images/fpt_schools_logo.png}" th:alt="#{app.brand}" alt="FPT Schools">
    </a>
    <div class="app-user" sec:authorize="isAuthenticated()">
        <!--/* Số chưa đọc do MenuBadgeInterceptor đưa vào Model sau khi xử lý trang (một truy vấn đếm). */-->
        <a class="app-bell" th:href="@{/notifications}"
           th:attr="aria-label=#{notification.bell(${unreadNotifications} ?: 0)}">
            <i class="bi bi-bell-fill"></i>
            <span th:if="${unreadNotifications != null and unreadNotifications > 0}" class="badge rounded-pill text-bg-danger"
                  th:text="${unreadNotifications > 99} ? '99+' : ${unreadNotifications}">3</span>
        </a>
        <!--/* Điện thoại chỉ hiện chữ cái đầu của tên (app.css); nút đăng xuất chỉ còn biểu tượng, có aria-label. */-->
        <span class="app-user-name" th:with="name=${#authentication.principal.fullName}">
            <span class="avatar-initial" aria-hidden="true"
                  th:text="${#strings.substring(name, name.lastIndexOf(' ') + 1, name.lastIndexOf(' ') + 2)}">A</span>
            <span class="app-user-full" th:text="${name}">Họ tên</span>
        </span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-primary" th:attr="aria-label=#{auth.logout}">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                <span class="d-none d-sm-inline" th:text="#{auth.logout}">Đăng xuất</span>
            </button>
        </form>
    </div>
</header>
</body>
</html>
