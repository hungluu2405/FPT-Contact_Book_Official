<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${pageTitle} + ' - ' + #{app.title}">Điểm danh</title>
</head>
<body>
<section>
    <!--/* Điểm danh theo môn của sinh viên (baseUrl /student/attendance) hoặc của con (/parent/children/{id}/attendance). */-->
    <h1 class="page-title" th:text="${pageTitle}">Điểm danh</h1>
    <p th:if="${noChildren}" class="alert alert-info" th:text="#{schedule.no-children}">Chưa liên kết con.</p>
    <th:block th:unless="${noChildren}">
        <form th:replace="~{fragments/schedule :: toolbar(${baseUrl}, null)}"></form>

        <div th:with="warned=${items.?[summary.warning]}">
            <div th:unless="${#lists.isEmpty(warned)}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="#{attendance.warning.banner(${#lists.size(warned)}, ${threshold})}">Có môn vắng quá ngưỡng</span>
            </div>
        </div>

        <div class="card card-custom p-4">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th th:text="#{section.subject}">Môn học</th>
                        <th:block th:replace="~{fragments/attendance :: headers}"></th:block>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${items}" th:classappend="${r.summary.warning} ? 'table-danger'">
                        <td>
                            <div class="fw-semibold" th:text="${r.subjectCode} + ' - ' + ${r.subjectName}">PRJ301</div>
                            <div class="small text-muted" th:text="${r.sectionCode}">PRJ301-SE1901-FA26</div>
                        </td>
                        <th:block th:replace="~{fragments/attendance :: cells(${r.summary}, ${threshold})}"></th:block>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{${baseUrl} + '/' + ${r.sectionId}}"
                               th:text="#{attendance.history}">Lịch sử</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="8" class="text-center text-muted py-4" th:text="#{attendance.no-sections}">Không có lớp</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p th:replace="~{fragments/attendance :: formula(${threshold})}"></p>
        </div>
    </th:block>
    <script th:src="@{/js/child-select.js}"></script>
</section>
</body>
</html>
