<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="#{'home.' + ${area}} + ' - ' + #{app.title}">Trang chủ</title>
</head>
<body>
<!--/* Dùng chung cho /admin, /teacher, /student, /parent; area quyết định tiêu đề. */-->
<section>
    <h1 class="page-title" th:text="#{'home.' + ${area}}">Trang chủ</h1>
    <p class="lead" th:text="#{home.greeting(${fullName})}">Xin chào</p>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card card-custom p-4 h-100">
                <h2 class="h5 mb-3" th:text="#{home.roles}">Vai trò của bạn</h2>
                <ul class="list-unstyled mb-0 role-list">
                    <li th:each="role : ${roles}">
                        <span class="badge rounded-pill role-badge" th:text="#{'role.' + ${role.roleCode}}">Vai trò</span>
                        <span th:if="${role.departmentName}" class="text-muted"
                              th:text="${role.departmentName} + ' (' + ${role.departmentCode} + ')'">Tổ chuyên môn</span>
                    </li>
                </ul>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="card card-custom p-4 h-100 coming-soon">
                <h2 class="h5" th:text="#{common.coming-soon}">Sắp có</h2>
                <p class="text-muted mb-0" th:text="#{common.coming-soon.detail}">Chức năng sẽ xuất hiện tại đây.</p>
            </div>
        </div>
    </div>
</section>
</body>
</html>
