<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="#{attendance.history} + ': ' + ${summary.subjectCode} + ' - ' + #{app.title}">Lịch sử điểm danh</title>
</head>
<body>
<section>
    <a th:replace="~{fragments/catalog :: back(${baseUrl}, #{common.back})}"></a>
    <h1 class="page-title" th:text="#{attendance.history} + ': ' + ${summary.subjectCode} + ' - ' + ${summary.subjectName}">Lịch sử</h1>
    <p class="text-muted" th:text="${summary.sectionCode}">PRJ301-SE1901-FA26</p>

    <div th:if="${summary.summary.warning}" class="alert alert-danger" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="#{attendance.warning.subject(${#numbers.formatDecimal(summary.summary.absentRate, 1, 1, 'COMMA')}, ${threshold})}">Vắng quá ngưỡng</span>
    </div>

    <div class="card card-custom p-4 mb-3">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr><th:block th:replace="~{fragments/attendance :: headers}"></th:block></tr>
                </thead>
                <tbody>
                <tr><th:block th:replace="~{fragments/attendance :: cells(${summary.summary}, ${threshold})}"></th:block></tr>
                </tbody>
            </table>
        </div>
        <p th:replace="~{fragments/attendance :: formula(${threshold})}"></p>
    </div>

    <div class="card card-custom p-4">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th th:text="#{session.no}">Buổi</th>
                    <th th:text="#{schedule.date}">Ngày</th>
                    <th th:text="#{schedule.time}">Giờ</th>
                    <th th:text="#{schedule.room}">Phòng</th>
                    <th th:text="#{attendance.title}">Điểm danh</th>
                    <th th:text="#{attendance.note}">Ghi chú</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${items.content}" th:classappend="${s.cancelled()} ? 'text-muted'">
                    <td th:text="${s.sessionNo}">1</td>
                    <td th:text="#{'weekday.' + ${s.date.dayOfWeek}} + ', ' + ${#temporals.format(s.date, 'dd/MM/yyyy')}">Thứ Hai, 01/09/2026</td>
                    <td th:text="${#temporals.format(s.startTime, 'HH:mm')} + '–' + ${#temporals.format(s.endTime, 'HH:mm')}">07:30–09:45</td>
                    <td th:text="${s.roomCode} ?: #{schedule.no-room}">R101</td>
                    <td>
                        <span th:if="${s.cancelled()}" class="badge text-bg-secondary" th:text="#{session-status.CANCELLED}">Đã hủy</span>
                        <!--/* th:replace chạy trước th:unless nên điều kiện phải nằm ở thẻ bao ngoài. */-->
                        <th:block th:unless="${s.cancelled()}"><span th:replace="~{fragments/attendance :: status(${s.status})}"></span></th:block>
                    </td>
                    <td class="small" th:text="${s.note}">Ghi chú</td>
                </tr>
                <tr th:if="${items.empty}">
                    <td colspan="6" class="text-center text-muted py-4" th:text="#{schedule.empty}">Chưa có buổi học</td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{fragments/pager :: pager(${pager})}"></nav>
    </div>
</section>
</body>
</html>
