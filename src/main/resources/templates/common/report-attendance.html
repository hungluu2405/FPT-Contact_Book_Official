<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="#{report.attendance.title} + ' - ' + #{app.title}">Báo cáo điểm danh</title>
</head>
<body>
<section>
    <h1 class="page-title" th:text="#{menu.reports}">Báo cáo</h1>
    <ul th:replace="~{fragments/reports :: tabs('attendance')}"></ul>
    <form th:replace="~{fragments/reports :: filters(${selection}, ${semesters}, ${path})}"></form>

    <!--/* Một lớp học phần: từng sinh viên ENROLLED. */-->
    <th:block th:if="${report.section != null}" th:with="d=${report.section}">
        <div class="row g-3 mb-3">
            <div th:replace="~{fragments/reports :: stat(#{attendance.section}, ${d.section.code})}"></div>
            <div th:replace="~{fragments/reports :: stat(#{report.teacher}, ${d.teacherName})}"></div>
            <div th:replace="~{fragments/reports :: stat(#{report.students}, ${#lists.size(d.students)})}"></div>
            <div th:replace="~{fragments/reports :: stat(#{report.sessions}, ${d.totalSessions})}"></div>
            <div th:replace="~{fragments/reports :: stat(#{report.class-rate}, ${d.classSummary.attendanceRate} != null ? ${#numbers.formatDecimal(d.classSummary.attendanceRate, 1, 1, 'COMMA')} + '%' : '—')}"></div>
            <div th:replace="~{fragments/reports :: stat(#{report.warnings(${report.thresholdPercent})}, ${d.warnings})}"></div>
        </div>
        <th:block th:replace="~{fragments/reports :: chart(${chart}, #{report.chart.class-status})}"></th:block>
        <div class="card card-custom p-4 mb-3">
            <h2 class="h5 mb-3" th:text="#{report.by-student}">Theo sinh viên</h2>
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th th:text="#{attendance.student-code}">Mã SV</th>
                        <th th:text="#{attendance.student}">Sinh viên</th>
                        <th:block th:replace="~{fragments/attendance :: headers}"></th:block>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${d.students}" th:classappend="${r.summary.warning} ? 'table-danger'">
                        <td th:text="${r.studentCode}">SE190001</td>
                        <td th:text="${r.fullName}">Nguyễn Văn A</td>
                        <th:block th:replace="~{fragments/attendance :: cells(${r.summary}, ${report.thresholdPercent})}"></th:block>
                    </tr>
                    <tr th:if="${#lists.isEmpty(d.students)}">
                        <td colspan="8" class="text-center text-muted py-4" th:text="#{attendance.no-students}">Chưa có sinh viên</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p th:replace="~{fragments/attendance :: formula(${report.thresholdPercent})}"></p>
        </div>
    </th:block>

    <!--/* Tổng hợp theo học kỳ: mỗi lớp một dòng; tổng tính trên mọi lớp trong bộ lọc. */-->
    <th:block th:if="${report.section == null}" th:with="t=${report.totals}">
        <div class="row g-3 mb-3">
            <div th:replace="~{fragments/reports :: stat(#{report.sections}, ${t.sections})}"></div>
            <div th:replace="~{fragments/reports :: stat(#{report.students}, ${t.students})}"></div>
            <div th:replace="~{fragments/reports :: stat(#{report.class-rate}, ${t.attendanceRate} != null ? ${#numbers.formatDecimal(t.attendanceRate, 1, 1, 'COMMA')} + '%' : '—')}"></div>
            <div th:replace="~{fragments/reports :: stat(#{report.warnings(${report.thresholdPercent})}, ${t.warnings})}"></div>
        </div>
        <th:block th:replace="~{fragments/reports :: chart(${chart}, #{report.chart.section-rate})}"></th:block>
        <div class="card card-custom p-4 mb-3">
            <h2 class="h5 mb-3" th:text="#{report.by-section}">Theo lớp học phần</h2>
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th th:text="#{attendance.section}">Lớp học phần</th>
                        <th th:text="#{section.subject}">Môn học</th>
                        <th th:text="#{report.teacher}">Giảng viên</th>
                        <th class="text-center" th:text="#{report.students}">Số SV</th>
                        <th class="text-center" th:text="#{report.sessions}">Số buổi</th>
                        <th class="text-center" th:text="#{report.class-rate}">Chuyên cần</th>
                        <th class="text-center" th:text="#{report.warnings(${report.thresholdPercent})}">Vượt ngưỡng</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${report.rows.content}">
                        <td><a th:href="@{/reports/attendance(sectionId=${r.section.id})}" th:text="${r.section.code}">PRJ301-SE1901-FA26</a></td>
                        <td th:text="${r.section.subjectCode} + ' - ' + ${r.section.subjectName}">PRJ301</td>
                        <td th:text="${r.teacherName}">Giảng viên</td>
                        <td class="text-center" th:text="${r.students}">0</td>
                        <td class="text-center" th:text="${r.totalSessions}">0</td>
                        <td class="text-center" th:text="${r.attendanceRate} != null ? ${#numbers.formatDecimal(r.attendanceRate, 1, 1, 'COMMA')} + '%' : '—'">100%</td>
                        <td class="text-center" th:classappend="${r.warnings > 0} ? 'text-danger fw-bold'" th:text="${r.warnings}">0</td>
                    </tr>
                    <tr th:if="${report.rows.empty}">
                        <td colspan="7" class="text-center text-muted py-4" th:text="#{report.no-sections}">Không có lớp học phần</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <nav th:replace="~{fragments/pager :: pager(${pager})}"></nav>
            <p class="small text-muted mt-2 mb-0" th:text="#{report.attendance.formula}">Công thức</p>
        </div>
    </th:block>
</section>
</body>
</html>
