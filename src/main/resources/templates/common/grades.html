<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${pageTitle} + ' - ' + #{app.title}">Điểm</title>
</head>
<body>
<section>
    <!--/* Điểm ĐÃ CÔNG BỐ của học sinh (baseUrl /student/grades) hoặc của con (/parent/children/{id}/grades).
         Service chỉ trả ô đã công bố; ô chưa công bố hiện như ô chưa có điểm. */-->
    <h1 class="page-title" th:text="${pageTitle}">Điểm</h1>
    <p th:if="${noChildren}" class="alert alert-info" th:text="#{schedule.no-children}">Chưa liên kết con.</p>
    <th:block th:unless="${noChildren}">
        <form th:replace="~{fragments/schedule :: toolbar(${baseUrl}, null)}"></form>
        <p th:if="${#lists.isEmpty(items)}" class="card card-custom p-4 text-muted" th:text="#{attendance.no-sections}">Không có lớp</p>
        <div class="card card-custom p-4 mb-3" th:each="r : ${items}">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
                <div>
                    <h2 class="h5 mb-0" th:text="${r.subjectCode} + ' - ' + ${r.subjectName}">PRJ301</h2>
                    <div class="small text-muted" th:text="${r.sectionCode}">PRJ301-SE1901-FA26</div>
                </div>
                <div class="text-end">
                    <div class="small text-muted" th:text="#{grade.average}">Trung bình</div>
                    <div class="fs-4"><th:block th:replace="~{fragments/grades :: average(${r.average})}"></th:block></div>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                    <thead>
                    <tr>
                        <th th:text="#{grade.component}">Đầu điểm</th>
                        <th class="text-center" th:text="#{grade.weight}">Trọng số</th>
                        <th class="text-center" th:text="#{grade.score}">Điểm</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${r.cells}">
                        <td th:text="${c.componentName}">Assignment</td>
                        <td class="text-center" th:text="${c.weight.stripTrailingZeros().toPlainString()} + '%'">20%</td>
                        <td class="text-center">
                            <span th:replace="~{fragments/grades :: score(${c.score})}"></span>
                            <span class="text-muted small" th:if="${c.score != null}"
                                  th:text="'/ ' + ${c.maxScore.stripTrailingZeros().toPlainString()}">/ 10</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(r.cells)}">
                        <td colspan="3" class="text-center text-muted" th:text="#{grade.no-components}">Chưa có đầu điểm</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <p th:replace="~{fragments/grades :: formula}"></p>
    </th:block>
    <script th:src="@{/js/child-select.js}"></script>
</section>
</body>
</html>
