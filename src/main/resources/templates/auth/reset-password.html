<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{forgot.reset.title} + ' - ' + #{app.title}">Đặt lại mật khẩu</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-body">
<!--/* Bước 2 quên mật khẩu: mã nhận qua email và mật khẩu mới. */-->
<main class="login-panel">
    <img class="brand-logo login-logo" th:src="@{/images/fpt_schools_logo.png}" th:alt="#{app.brand}" alt="FPT Schools">
    <div class="brand-stripe" aria-hidden="true"><span></span><span></span><span></span></div>

    <h1 class="login-greeting" th:text="#{forgot.reset.title}">Đặt lại mật khẩu</h1>
    <div th:if="${codeSent}" class="alert alert-success" role="status" th:text="#{forgot.request.sent}">
        Nếu tài khoản có email, mã xác nhận đã được gửi.
    </div>

    <form class="login-form" th:action="@{/reset-password}" th:object="${form}" method="post" novalidate>
        <div class="mb-3">
            <label for="phone" class="form-label" th:text="#{auth.login.phone}">Số điện thoại</label>
            <input type="tel" class="form-control form-control-lg" th:field="*{phone}"
                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                   placeholder="0901234567" autocomplete="username" inputmode="tel" required>
            <div class="invalid-feedback" th:errors="*{phone}">Lỗi</div>
        </div>
        <div class="mb-3">
            <label for="code" class="form-label" th:text="#{forgot.code}">Mã xác nhận</label>
            <input type="text" class="form-control form-control-lg" th:field="*{code}"
                   th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                   maxlength="6" autocomplete="one-time-code" inputmode="numeric" required>
            <div class="invalid-feedback" th:errors="*{code}">Lỗi</div>
        </div>
        <div class="mb-3">
            <label for="newPassword" class="form-label" th:text="#{password.new}">Mật khẩu mới</label>
            <div class="input-group input-group-lg has-validation">
                <input type="password" class="form-control" th:field="*{newPassword}"
                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                       autocomplete="new-password" aria-describedby="passwordHint">
                <button type="button" class="btn btn-outline-secondary" data-toggle-password="#newPassword"
                        th:attr="aria-label=#{auth.login.show-password}"><i class="bi bi-eye"></i></button>
                <div class="invalid-feedback" th:errors="*{newPassword}">Lỗi</div>
            </div>
            <div id="passwordHint" class="form-text" th:text="#{forgot.reset.hint}">Gợi ý</div>
        </div>
        <div class="mb-4">
            <label for="confirmPassword" class="form-label" th:text="#{password.confirm}">Nhập lại mật khẩu mới</label>
            <input type="password" class="form-control form-control-lg" th:field="*{confirmPassword}"
                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                   autocomplete="new-password">
            <div class="invalid-feedback" th:errors="*{confirmPassword}">Lỗi</div>
        </div>
        <button type="submit" class="btn btn-orange btn-lg w-100 login-submit" th:text="#{forgot.reset.submit}">
            Đặt lại mật khẩu
        </button>
    </form>

    <p class="login-forgot">
        <a th:href="@{/forgot-password}" th:text="#{forgot.reset.resend}">Gửi lại mã</a>
        &middot;
        <a th:href="@{/login}" th:text="#{forgot.back-to-login}">Quay lại đăng nhập</a>
    </p>
</main>
<footer class="login-footer" th:text="#{app.copyright}">© FPT Education</footer>
<script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
