<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{forgot.title} + ' - ' + #{app.title}">Quên mật khẩu</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-body">
<!--/* Bước 1 quên mật khẩu: cùng khung với trang đăng nhập. */-->
<main class="login-panel">
    <img class="brand-logo login-logo" th:src="@{/images/fpt_schools_logo.png}" th:alt="#{app.brand}" alt="FPT Schools">
    <div class="brand-stripe" aria-hidden="true"><span></span><span></span><span></span></div>

    <h1 class="login-greeting" th:text="#{forgot.title}">Quên mật khẩu</h1>
    <p class="text-secondary" th:text="#{forgot.request.intro}">Nhập số điện thoại đăng nhập.</p>

    <form class="login-form" th:action="@{/forgot-password}" th:object="${form}" method="post" novalidate>
        <div class="mb-4">
            <label for="phone" class="form-label" th:text="#{auth.login.phone}">Số điện thoại</label>
            <div class="input-group input-group-lg has-validation">
                <span class="input-group-text"><i class="bi bi-phone"></i></span>
                <input type="tel" class="form-control" th:field="*{phone}"
                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                       placeholder="0901234567" autocomplete="username" inputmode="tel" required autofocus>
                <div class="invalid-feedback" th:errors="*{phone}">Lỗi</div>
            </div>
        </div>
        <button type="submit" class="btn btn-orange btn-lg w-100 login-submit" th:text="#{forgot.request.submit}">
            Gửi mã xác nhận
        </button>
    </form>

    <p class="login-forgot"><a th:href="@{/login}" th:text="#{forgot.back-to-login}">Quay lại đăng nhập</a></p>
</main>
<footer class="login-footer" th:text="#{app.copyright}">© FPT Education</footer>
</body>
</html>
