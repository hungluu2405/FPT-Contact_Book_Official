<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="#{password.title} + ' - ' + #{app.title}">Đổi mật khẩu</title>
</head>
<body>
<section>
    <h1 class="page-title" th:text="#{password.title}">Đổi mật khẩu</h1>
    <div th:if="${forced}" class="alert alert-warning" role="alert" th:text="#{password.forced}">
        Bạn cần đổi mật khẩu trước khi tiếp tục.
    </div>

    <div class="card card-custom p-4 form-narrow">
        <form th:action="@{/change-password}" th:object="${form}" method="post" novalidate>
            <div class="mb-3">
                <label for="currentPassword" class="form-label" th:text="#{password.current}">Mật khẩu hiện tại</label>
                <div class="input-group">
                    <input type="password" class="form-control" th:field="*{currentPassword}"
                           th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                           autocomplete="current-password">
                    <button type="button" class="btn btn-outline-secondary" data-toggle-password="#currentPassword"
                            th:attr="aria-label=#{auth.login.show-password}"><i class="bi bi-eye"></i></button>
                    <div class="invalid-feedback" th:errors="*{currentPassword}">Lỗi</div>
                </div>
            </div>
            <div class="mb-3">
                <label for="newPassword" class="form-label" th:text="#{password.new}">Mật khẩu mới</label>
                <div class="input-group">
                    <input type="password" class="form-control" th:field="*{newPassword}"
                           th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                           autocomplete="new-password" aria-describedby="passwordHint">
                    <button type="button" class="btn btn-outline-secondary" data-toggle-password="#newPassword"
                            th:attr="aria-label=#{auth.login.show-password}"><i class="bi bi-eye"></i></button>
                    <div class="invalid-feedback" th:errors="*{newPassword}">Lỗi</div>
                </div>
                <div id="passwordHint" class="form-text" th:text="#{password.hint}">Gợi ý</div>
            </div>
            <div class="mb-4">
                <label for="confirmPassword" class="form-label" th:text="#{password.confirm}">Nhập lại</label>
                <input type="password" class="form-control" th:field="*{confirmPassword}"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                       autocomplete="new-password">
                <div class="invalid-feedback" th:errors="*{confirmPassword}">Lỗi</div>
            </div>
            <button type="submit" class="btn btn-orange btn-lg" th:text="#{common.save}">Lưu</button>
        </form>
    </div>
</section>
</body>
</html>
