<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.login.title} + ' - ' + #{app.title}">Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-body">
<!--/* Cùng phong cách với màn hình đăng nhập của app mobile: nền trắng, logo, dải ba màu FPT, nút cam. */-->
<main class="login-panel">
    <img class="brand-logo login-logo" th:src="@{/images/fpt_schools_logo.png}" th:alt="#{app.brand}" alt="FPT Schools">
    <div class="brand-stripe" aria-hidden="true"><span></span><span></span><span></span></div>

    <h1 class="login-greeting" th:text="#{auth.login.greeting}">Xin chào!</h1>

    <div th:if="${errorMessageKey}" class="alert alert-danger" role="alert" th:text="#{${errorMessageKey}}">
        Số điện thoại hoặc mật khẩu không đúng
    </div>
    <div th:if="${infoMessageKey}" class="alert alert-success" role="status" th:text="#{${infoMessageKey}}">
        Bạn đã đăng xuất
    </div>

    <form class="login-form" th:action="@{/login}" method="post" novalidate>
        <div class="mb-3">
            <label for="phone" class="form-label" th:text="#{auth.login.phone}">Số điện thoại</label>
            <div class="input-group input-group-lg">
                <span class="input-group-text"><i class="bi bi-phone"></i></span>
                <input type="tel" id="phone" name="phone" class="form-control"
                       placeholder="0901234567" autocomplete="username" inputmode="tel" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label" th:text="#{auth.login.password}">Mật khẩu</label>
            <div class="input-group input-group-lg">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" name="password" class="form-control"
                       autocomplete="current-password" required>
                <button type="button" class="btn btn-outline-secondary" data-toggle-password="#password"
                        th:attr="aria-label=#{auth.login.show-password}">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn btn-orange btn-lg w-100 login-submit" th:text="#{auth.login.submit}">Đăng nhập</button>
    </form>

    <p class="login-forgot"><a th:href="@{/forgot-password}" th:text="#{auth.login.forgot}">Quên mật khẩu?</a></p>
</main>
<footer class="login-footer" th:text="#{app.copyright}">© FPT Education</footer>
<script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
