<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.login.title} + ' - ' + #{app.title}">Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-body">
<!--/* Logo: chưa có static/images/fpt_logo.png nên tạm dùng chữ. */-->
<header class="login-hero">
    <div class="login-brand" th:text="#{app.brand}">FPT University</div>
    <h1 class="login-title" th:text="#{auth.login.title}">Đăng nhập</h1>
    <p class="login-subtitle" th:text="#{auth.login.subtitle}">Sổ liên lạc điện tử dành cho sinh viên</p>
</header>

<main class="login-card-wrap">
    <div class="login-card">
        <div th:if="${errorMessageKey}" class="alert alert-danger" role="alert" th:text="#{${errorMessageKey}}">
            Số điện thoại hoặc mật khẩu không đúng
        </div>
        <div th:if="${infoMessageKey}" class="alert alert-success" role="status" th:text="#{${infoMessageKey}}">
            Bạn đã đăng xuất
        </div>

        <form th:action="@{/login}" method="post" novalidate>
            <div class="mb-3">
                <label for="phone" class="form-label" th:text="#{auth.login.phone}">Số điện thoại</label>
                <input type="tel" id="phone" name="phone" class="form-control form-control-lg"
                       placeholder="0901234567" autocomplete="username" inputmode="tel" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label" th:text="#{auth.login.password}">Mật khẩu</label>
                <div class="input-group input-group-lg">
                    <input type="password" id="password" name="password" class="form-control"
                           autocomplete="current-password" required>
                    <button type="button" class="btn btn-outline-secondary" data-toggle-password="#password"
                            th:attr="aria-label=#{auth.login.show-password}">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-orange btn-lg w-100" th:text="#{auth.login.submit}">Đăng nhập</button>
        </form>

        <p class="login-forgot" th:text="#{auth.login.forgot}">Quên mật khẩu? Vui lòng liên hệ quản trị viên.</p>
    </div>
</main>
<script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
