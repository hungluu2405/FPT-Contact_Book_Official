<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="#{menu.notifications.sent} + ' - ' + #{app.title}">Đã gửi</title>
</head>
<body>
<section>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="page-title mb-0" th:text="#{menu.notifications.sent}">Đã gửi</h1>
        <a class="btn btn-orange" th:href="@{/notifications/new}"><i class="bi bi-send"></i>
            <span th:text="#{menu.notifications.new}">Gửi thông báo</span></a>
    </div>
    <div class="card card-custom p-4">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th th:text="#{notification.title}">Tiêu đề</th>
                    <th th:text="#{notification.target}">Phạm vi</th>
                    <th th:text="#{notification.sent-at}">Thời điểm gửi</th>
                    <th class="text-center" th:text="#{notification.stats}">Đã đọc</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="n : ${items.content}">
                    <td><span th:replace="~{fragments/notifications :: priority(${n.priority})}"></span>
                        <a th:href="@{/notifications/{id}(id=${n.id})}" th:text="${n.title}">Tiêu đề</a></td>
                    <td th:text="#{'notification-target.' + ${n.targetType}}">Lớp học phần</td>
                    <td th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}">01/10/2026</td>
                    <td class="text-center" th:text="#{notification.stats.value(${n.readCount}, ${n.recipientCount}, ${n.readPercent()})}">0 / 0 (0%)</td>
                </tr>
                <tr th:if="${items.empty}">
                    <td colspan="4" class="text-center text-muted py-4" th:text="#{notification.sent.empty}">Chưa gửi</td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{fragments/pager :: pager(${pager})}"></nav>
    </div>
</section>
</body>
</html>
