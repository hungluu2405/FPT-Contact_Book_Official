<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="#{message.title} + ' - ' + #{app.title}">Tin nhắn</title>
</head>
<body>
<section>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="page-title mb-0" th:text="#{message.title}">Tin nhắn</h1>
        <a class="btn btn-primary" th:href="@{/messages/contacts}">
            <i class="bi bi-pencil-square"></i> <span th:text="#{message.new}">Nhắn tin mới</span></a>
    </div>
    <div class="row g-3">
        <!--/* Đang mở hội thoại thì trên điện thoại khung chat lên trước danh sách. */-->
        <div class="col-lg-4" th:classappend="${chat != null} ? 'order-2 order-lg-1'">
            <div class="card card-custom">
                <div class="card-header fw-semibold" th:text="#{message.conversations}">Hội thoại</div>
                <div class="list-group list-group-flush">
                    <a th:each="c : ${conversations.content}" th:href="@{/messages/{id}(id=${c.id})}"
                       class="list-group-item list-group-item-action py-3 conversation-item"
                       th:classappend="${chat != null and chat.conversationId == c.id} ? 'active'">
                        <div class="d-flex justify-content-between gap-2">
                            <span class="fw-semibold text-truncate" th:text="${c.otherName}">Người kia</span>
                            <span th:if="${c.unread > 0}" class="badge rounded-pill text-bg-danger conversation-unread"
                                  th:text="${c.unread}" th:attr="aria-label=#{message.unread(${c.unread})}">2</span>
                        </div>
                        <div class="small text-truncate">
                            <span th:if="${c.lastMine}" th:text="#{message.you}">Bạn:</span>
                            <em th:if="${c.lastDeleted}" th:text="#{message.deleted}">Tin nhắn đã bị xóa</em>
                            <span th:unless="${c.lastDeleted}" th:text="${#strings.abbreviate(c.lastContent, 80)}">Tin cuối</span>
                        </div>
                        <small class="conversation-time" th:text="${#temporals.format(c.lastSentAt, 'dd/MM/yyyy HH:mm')}">01/10/2026 08:00</small>
                    </a>
                    <div th:if="${conversations.empty}" class="list-group-item text-center text-muted py-4"
                         th:text="#{message.conversations.empty}">Chưa có hội thoại nào.</div>
                </div>
            </div>
            <nav th:replace="~{fragments/pager :: pager(${pager})}"></nav>
        </div>

        <div class="col-lg-8" th:classappend="${chat != null} ? 'order-1 order-lg-2'">
            <div th:if="${chat == null}" class="card card-custom">
                <div class="card-body text-center text-muted py-5" th:text="#{message.pick}">Chọn một hội thoại.</div>
            </div>
            <div th:if="${chat != null}" class="card card-custom">
                <div class="card-header d-flex justify-content-between align-items-center gap-2">
                    <span class="fw-semibold" th:text="${chat.otherName}">Người kia</span>
                    <a th:if="${chat.conversationId != null}" class="btn btn-outline-secondary btn-sm"
                       th:href="@{/messages/{id}(id=${chat.conversationId})}">
                        <i class="bi bi-arrow-clockwise"></i>
                        <span th:text="${viewingOlder} ? #{message.back-to-latest} : #{message.refresh}">Tải lại</span></a>
                </div>
                <div class="card-body chat-messages" id="chat-messages"
                     th:attr="data-newer-url=${chat.conversationId != null and viewingOlder != true} ? @{/messages/{id}/newer(id=${chat.conversationId})} : null,
                              data-after=${chat.newestId()}">
                    <th:block th:replace="~{messages/fragments :: older}"></th:block>
                    <p th:if="${chat.messages.empty}" class="text-center text-muted my-4 chat-empty"
                       th:text="#{message.empty}">Chưa có tin nhắn nào.</p>
                </div>
                <div class="card-footer">
                    <div th:unless="${chat.canSend}" class="alert alert-warning mb-0" th:text="#{message.cannot-send}">
                        Không gửi được tin mới.</div>
                    <form th:if="${chat.canSend}" method="post" th:object="${form}"
                          th:action="${chat.conversationId != null} ? @{/messages/{id}/send(id=${chat.conversationId})} : @{/messages/with/{u}(u=${chat.otherUserId})}">
                        <div class="alert alert-danger" th:each="e : ${#fields.globalErrors()}" th:text="${e}">Lỗi</div>
                        <label class="visually-hidden" for="content" th:text="#{message.content}">Nội dung tin nhắn</label>
                        <div class="d-flex gap-2 align-items-start">
                            <textarea id="content" class="form-control" rows="2" maxlength="2000" required
                                      th:field="*{content}" th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"
                                      th:placeholder="#{message.content.placeholder}"></textarea>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-send"></i> <span th:text="#{message.send}">Gửi</span></button>
                        </div>
                        <div th:if="${#fields.hasErrors('content')}" class="invalid-feedback d-block" th:errors="*{content}">Lỗi</div>
                        <div class="form-text" th:text="#{message.content.hint}">Tối đa 2000 ký tự.</div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/messages.js}"></script>
</section>
</body>
</html>
