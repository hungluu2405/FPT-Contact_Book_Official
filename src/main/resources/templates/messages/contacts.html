<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="#{message.new} + ' - ' + #{app.title}">Nhắn tin mới</title>
</head>
<body>
<section>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="page-title mb-0" th:text="#{message.contacts}">Chọn người nhận</h1>
        <a class="btn btn-outline-secondary" th:href="@{/messages}">
            <i class="bi bi-arrow-left"></i> <span th:text="#{common.back}">Quay lại</span></a>
    </div>
    <p class="text-muted" th:text="#{message.contacts.hint}">Chỉ hiện những người bạn được phép nhắn tin.</p>
    <form class="row g-2 mb-3" method="get" th:action="@{/messages/contacts}">
        <div class="col-md-8">
            <label class="visually-hidden" for="q" th:text="#{message.contacts.search}">Tìm kiếm</label>
            <input type="search" id="q" name="q" class="form-control" th:value="${q}"
                   th:placeholder="#{message.contacts.search}">
        </div>
        <div class="col-md-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i>
                <span th:text="#{common.search}">Tìm kiếm</span></button>
            <a class="btn btn-outline-secondary" th:href="@{/messages/contacts}" th:text="#{common.reset}">Đặt lại</a>
        </div>
    </form>
    <div class="card card-custom">
        <div class="list-group list-group-flush">
            <div th:each="c : ${contacts.content}"
                 class="list-group-item d-flex flex-wrap justify-content-between align-items-center gap-2 py-3">
                <div>
                    <div class="fw-semibold" th:text="${c.fullName}">Họ tên</div>
                    <span th:each="r : ${c.roles}" class="badge text-bg-light border me-1" th:text="#{'role.' + ${r}}">Giảng viên</span>
                </div>
                <a class="btn btn-outline-primary" th:href="@{/messages/with/{id}(id=${c.userId})}">
                    <i class="bi bi-chat-dots"></i> <span th:text="#{message.contacts.message}">Nhắn tin</span></a>
            </div>
            <div th:if="${contacts.empty}" class="list-group-item text-center text-muted py-4"
                 th:text="#{message.contacts.empty}">Không có người nào phù hợp.</div>
        </div>
    </div>
    <nav th:replace="~{fragments/pager :: pager(${pager})}"></nav>
</section>
</body>
</html>
