# Profile test: database tạm FptContactBook_test trên SQL Server localhost.
# Database được TestDatabaseExtension xóa và tạo lại từ database/fpt_contact_book.sql đầu mỗi lượt chạy test.
# Mặc định trong TestDatabaseExtension phải khớp với các giá trị dưới đây.
spring.datasource.url=${TEST_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=FptContactBook_test;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
