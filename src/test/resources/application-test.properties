# Profile test: database tạm FptContactBook_test trên SQL Server localhost.
# TestDatabaseExtension xóa và tạo lại database từ database/fpt_contact_book.sql (đọc TEST_DB_URL,
# TEST_DB_USERNAME, TEST_DB_PASSWORD), kiểm tra rào chắn rồi đặt spring.datasource.* thành system property.
# URL dưới đây cố ý không hợp lệ: lớp test nào quên @ExtendWith(TestDatabaseExtension.class) sẽ lỗi ngay
# thay vì kết nối nhầm database.
spring.datasource.url=jdbc:sqlserver://datasource-not-initialized-by-TestDatabaseExtension.invalid

# Ảnh đại diện tải lên trong test, nằm trong target/ nên mvn clean sẽ xóa.
app.upload-dir=target/test-uploads

# Khoa ky JWT chi dung cho test (khong phai bi mat); AuthApiIntegrationTest dung lai de tao token het han.
app.jwt.secret=test-only-jwt-signing-key-not-a-secret-0123
